services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nova_estate
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova_secret
    ports:
      - "5432:5432"
    volumes:
      - nova_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova_estate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nova_pgdata:
